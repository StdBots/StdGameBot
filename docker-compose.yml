version: '3.8'

services:
  bot:
    build: .
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=stdgamebot_db
      - ADMIN_IDS=${ADMIN_IDS:-7394590844}
      - DAILY_REWARD=500
      - STARTING_COINS=1000
      - MAX_BET=50000
      - ENV=production
    depends_on:
      - mongo

  mongo:
    image: mongo:6.0
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
